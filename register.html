<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Your Profile | Safe Creatives</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <!-- Guarded, but allow-incomplete: this is the page that FIXES an
       incomplete profile, so the usual "incomplete profile -> register"
       redirect must not apply here or it would loop. -->
  <body data-requires-auth="true" data-allow-incomplete="true">
    <header class="site-header" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Safe Creatives home">
        <img class="brand-logo" src="./ASSET/SC_Logo_Logomark_Secondary.png" alt="" onerror="this.style.display='none'" />
        <span>SAFE CREATIVES</span>
      </a>
      <nav class="primary-nav" aria-label="Main links">
        <a href="index.html#sensory-rooms">Sensory rooms</a>
        <a href="index.html#turnkey-solutions">Turnkey Solutions</a>
      </nav>
    </header>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="register-title">

        <p class="eyebrow">ALMOST THERE</p>

        <h1 id="register-title">A few details.</h1>

        <p class="form-intro">
          Your email <strong id="verified-email">is verified</strong>. We just
          need a little more so we can reach you about your order.
        </p>

        <form id="register-form">

          <label for="full-name">Full Name</label>
          <input
            id="full-name"
            type="text"
            placeholder="Your full name"
            autocomplete="name"
            required
          />

          <label for="phone">Phone Number</label>
          <input
            id="phone"
            type="tel"
            placeholder="+91 98765 43210"
            autocomplete="tel"
            required
          />

          <label for="address">Delivery Address <span class="label-hint">(optional — you can add this at checkout)</span></label>
          <textarea
            id="address"
            rows="3"
            placeholder="Flat / house number, street, area, city, state, PIN code"
            autocomplete="street-address"
          ></textarea>

          <button
            class="primary-button"
            id="save-profile"
            type="submit"
          >
            Continue
          </button>

        </form>

        <p
          id="register-message"
          class="form-message"
          role="status"
        ></p>

      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>
    <script src="register.js"></script>
  </body>
</html>
