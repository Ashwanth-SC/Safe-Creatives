<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="./ASSET/SC_Logo_Logomark_Secondary.png" />
    <title>Login | Safe Creatives</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header auth-header" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Safe Creatives home">
        <img class="brand-logo" src="./ASSET/SC_Logo_Logomark_Secondary.png" alt="" onerror="this.style.display='none'" />
        <span>SAFE CREATIVES</span>
      </a>
      <a class="header-home-link" href="index.html">← Back to home</a>
    </header>
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="auth-title">

        <p class="eyebrow">SAFE CREATIVES</p>

        <h1 id="auth-title">Let's save your design.</h1>

        <p class="form-intro">
          Enter your email and we'll send you a verification code. New here?
          We'll ask for your details after that.
        </p>

        <!-- STEP 1 : EMAIL ONLY -->
        <!-- Name and phone are deliberately NOT collected here. Whether this
             email already has an account is not knowable until after the code
             is verified, so asking for details up front means asking returning
             customers for information we already hold. -->

        <div id="details-section">

          <form id="details-form">

            <label for="email">Email Address</label>
            <input
              id="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />

            <button
              class="primary-button"
              id="send-otp"
              type="submit"
            >
              Continue
            </button>

          </form>

        </div>

        <!-- STEP 2 : OTP -->

        <div id="otp-section" hidden>

          <p class="form-intro">
            Enter the verification code sent to your email.
          </p>

          <form id="otp-form">

            <label for="otp">Verification Code</label>

            <input
              id="otp"
              type="text"
              maxlength="6"
              inputmode="numeric"
              placeholder="123456"
              required
            />

            <button
              class="primary-button"
              id="verify-otp"
              type="submit"
            >
              Verify
            </button>

          </form>

          <button
            class="inline-button"
            id="resend-otp"
            type="button"
          >
            Resend Code
          </button>

        </div>

        <p
          id="auth-message"
          class="form-message"
          role="status"
        ></p>

      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="login.js"></script>
  </body>
</html>
